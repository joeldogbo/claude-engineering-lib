# Groupes d'agents et profils d'installation, lus par install.sh et install.ps1.
# Chaque agent déclare son groupe dans son frontmatter (`group: <nom>`).
#
#   group|<nom>|<description>
#   profile|<nom>|<description>|<groupes séparés par des espaces>
#
# Le groupe core est toujours installé : il porte la coordination des agents.

group|core|Socle, toujours installé : contexte partagé, langue, architecture, revue, refactoring, tests, débogage, git, versions, cahier des charges
group|docs|Documentation : README, ADR, changelog, manuels développeur, utilisateur et déploiement
group|ui|Interface : composants, frameworks UI, ergonomie, accessibilité
group|backend|Serveur : logique métier, API, robustesse, base de données, intégrations, e-mails
group|security|Sécurité : audit (N1) et correction des failles (N2)
group|performance|Performance : analyse et tests de charge
group|ops|Mise en production : choix d'hébergement, CI/CD, déploiement
group|seo|Visibilité web : référencement et moteurs génératifs
group|compliance|Conformité : pages légales, données personnelles, cookies, finance
group|business|Métier en ligne : paiements, chatbot IA
group|tooling|Outils du poste : jetons Claude Code, santé du PC, compression de prompts

profile|web|Site ou application web|core docs ui backend security performance ops seo compliance business tooling
profile|mobile|Application mobile (Flutter, React Native, natif)|core docs ui backend security performance ops compliance business tooling
profile|api|API ou service backend sans interface|core docs backend security performance ops compliance tooling
profile|desktop|Application de bureau (Electron, Tauri, WPF...)|core docs ui security performance ops tooling
profile|library|Bibliothèque, CLI ou script|core docs security performance ops tooling
