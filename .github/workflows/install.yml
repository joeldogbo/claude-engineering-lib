name: Installation

# Exécute réellement les installateurs sur chaque OS et chaque shell pris en charge.
on:
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - .github/scripts/**
      - .github/workflows/install.yml
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - .github/scripts/**
      - .github/workflows/install.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    name: install.sh · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning install.sh .github/scripts/test-install.sh

      - name: Tests de bout en bout
        shell: bash
        run: bash .github/scripts/test-install.sh

  powershell:
    name: install.ps1 · ${{ matrix.os }} · ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: powershell }  # Windows PowerShell 5.1
          - { os: windows-latest, shell: pwsh }
          - { os: ubuntu-latest, shell: pwsh }
          - { os: macos-latest, shell: pwsh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tests de bout en bout
        shell: ${{ matrix.shell }}
        run: ./.github/scripts/test-install.ps1
