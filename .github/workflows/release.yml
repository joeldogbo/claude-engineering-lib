name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Empreintes calculées sur l'archive du tag, celle que téléchargent les installateurs :
      # install.sh et install.ps1 refusent tout fichier dont l'empreinte diffère.
      - name: Empreintes SHA-256 des fichiers de la bibliothèque
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          git archive "$GITHUB_REF_NAME" | tar -x -C "$RUNNER_TEMP/lib"
          (cd "$RUNNER_TEMP/lib" && find CLAUDE.md profiles.conf agents skills standards templates workflows hooks -type f \
            | LC_ALL=C sort | xargs sha256sum) > SHA256SUMS
          test -s SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: SHA256SUMS
